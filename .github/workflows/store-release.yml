name: Build and upload store releases

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to build and upload
        type: choice
        options: [android, ios, all]
        default: android
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_UPLOAD_JSON }}
        run: |
          for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$PLAY_JSON"; do
            if [ -z "$value" ]; then echo 'Android store secrets are missing' >&2; exit 1; fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
      - name: Run tests and build signed bundle
        run: |
          flutter test
          flutter build appbundle --release --dart-define=RC_VERIFIED_BACKEND_READY=false
      - uses: actions/upload-artifact@v4
        with:
          name: stokpilot-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_UPLOAD_JSON }}
          packageName: com.yesildas.stokpilot
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

  ios:
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Apple signing secrets
        id: apple_keys
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          for value in "$CERT" "$CERT_PASSWORD" "$PROFILE" "$TEAM"; do
            if [ -z "$value" ]; then echo 'Apple signing secrets are missing' >&2; exit 1; fi
          done
          if [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            echo 'upload_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload_ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install signing certificate, profile and upload key
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/stokpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.private_keys"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          if [ -n "$API_KEY" ]; then
            printf '%s' "$API_KEY" | base64 -D > "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
            chmod 600 "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          fi
          {
            printf '\nDEVELOPMENT_TEAM = %s\n' "$TEAM"
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$PROFILE_NAME"
            printf 'CODE_SIGN_IDENTITY = iPhone Distribution\n'
          } >> ios/Flutter/Release.xcconfig
          export PROFILE_NAME TEAM
          python3 - <<'PY'
          import os, plistlib
          with open('ios/ExportOptions.plist', 'wb') as output:
              plistlib.dump({
                  'method': 'app-store-connect',
                  'destination': 'export',
                  'signingStyle': 'manual',
                  'teamID': os.environ['TEAM'],
                  'provisioningProfiles': {
                      'com.yesildas.stokpilot': os.environ['PROFILE_NAME'],
                  },
              }, output)
          PY
      - name: Build signed IPA
        run: |
          flutter pub get
          flutter test
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=RC_VERIFIED_BACKEND_READY=false
      - uses: actions/upload-artifact@v4
        with:
          name: stokpilot-ios-ipa
          path: build/ios/ipa/*.ipa
      - name: Upload IPA to App Store Connect
        if: steps.apple_keys.outputs.upload_ready == 'true'
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
