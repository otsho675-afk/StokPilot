name: Clean Dart lint warnings

on:
  push:
    paths:
      - '.github/workflows/dart-lints-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dart-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter
        run: |
          flutter create --project-name stokpilot --org com.yesildas --platforms android,ios .
          flutter pub get
      - name: Apply official Dart lint fixes
        run: |
          dart fix --apply
          dart format lib test
          git diff --check
      - name: Verify before committing
        run: |
          flutter analyze
          flutter test
      - name: Commit fixed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Dart analyzer lint fixes"
            git push origin HEAD:main
          fi
